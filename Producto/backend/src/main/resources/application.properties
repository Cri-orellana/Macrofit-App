spring.application.name=macrofit
server.port=${PORT:8080}

# ---------- Base de datos (MySQL) ----------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:macrofit_db}?sslMode=${DB_SSL_MODE:PREFERRED}&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:macrofit}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ---------- APIs externas ----------
# Spoonacular es OPCIONAL: sin key la app usa las recetas de respaldo guardadas en la BDD
spoonacular.api.key=${SPOONACULAR_API_KEY:}
spoonacular.api.url=${SPOONACULAR_API_URL:https://api.spoonacular.com/recipes/complexSearch}
spoonacular.cache.ttl-hours=${SPOONACULAR_CACHE_TTL_HOURS:24}

# OpenFoodFacts no necesita key, pero pide identificar la app
openfoodfacts.user-agent=${OFF_USER_AGENT:Macrofit-Portfolio/1.0 (+https://github.com/Cri-orellana/Macrofit-App)}

# ---------- Seguridad ----------
# SIN valor por defecto a propósito: hay que definir JWT_SECRET (mínimo 32 caracteres)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Orígenes permitidos por CORS (separados por coma)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://macrofit-administracion.vercel.app}

# ---------- Datos de demostración ----------
app.demo.seed-catalog=${DEMO_SEED_CATALOG:true}
app.demo.seed-users=${DEMO_SEED_USERS:true}
app.demo.admin-email=${DEMO_ADMIN_EMAIL:admin@macrofit.demo}
app.demo.admin-password=${DEMO_ADMIN_PASSWORD:Admin1234}
app.demo.user-email=${DEMO_USER_EMAIL:demo@macrofit.demo}
app.demo.user-password=${DEMO_USER_PASSWORD:Demo1234}
